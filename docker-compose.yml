services:
  guacamole:
    image: jwetzell/guacamole:1.6.0-20260804
    restart: unless-stopped
    volumes:
      - guacamole_config:/config
    environment:
      TZ: Asia/Kolkata
    ports:
      - 49201:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  guacamole_config:
